<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avante Travel — Special Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0DCDC2;
    --teal-dark:#0aa89f;
    --navy:#0e2f44;
    --ink:#333333;
    --muted:#808080;
    --mint:#f4fbfa;
    --line:#e3e9e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans', sans-serif;
    color:var(--ink);
    background:#ffffff;
  }
  h1,h2,h3,.brand{ font-family:'Montserrat', sans-serif; }

  .topbar{
    background:var(--teal);
    color:#fff;
    font-size:12.5px;
    padding:6px 24px;
    text-align:right;
  }

  header.hub-header{
    display:flex;
    align-items:center;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-weight:800;
    font-size:22px;
    color:var(--teal);
    letter-spacing:0.01em;
    line-height:1.1;
  }
  .brand span{ display:block; color:var(--navy); font-size:14px; font-weight:600; letter-spacing:0.08em;}

  main{
    max-width:560px;
    margin:0 auto;
    padding:56px 20px 80px;
  }

  .hero{ text-align:center; margin-bottom:28px; }
  .hero h1{ color:var(--teal); text-transform:uppercase; font-size:26px; margin:0 0 6px; }
  .hero p{ color:var(--muted); margin:0; font-size:14.5px; }

  .card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:32px 30px 36px;
    box-shadow:0 10px 30px rgba(14,47,68,0.06);
    text-align:center;
  }

  .cta{
    display:block;
    width:100%;
    padding:15px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15.5px;
    font-weight:700;
    font-family:'Montserrat', sans-serif;
    cursor:pointer;
    text-decoration:none;
    box-sizing:border-box;
  }
  .cta:hover{ background:var(--teal-dark); }

  .cta-outline{
    display:inline-block;
    margin-top:16px;
    padding:11px 22px;
    background:#fff;
    color:var(--teal-dark);
    border:1.5px solid var(--teal);
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    font-family:'Montserrat', sans-serif;
    cursor:pointer;
    text-decoration:none;
  }
  .cta-outline:hover{ background:var(--mint); }

  .promo-image{
    display:none;
    width:100%;
    max-height:280px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:22px;
  }
  .promo-image.show{ display:block; }

  .placeholder{
    text-align:center;
    padding:56px 24px;
    background:var(--mint);
    border-radius:14px;
    border:1.5px dashed #bfe6e2;
  }
  .placeholder .badge{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  .placeholder h3{ color:var(--navy); margin:0 0 8px; font-size:19px; }
  .placeholder p{ color:var(--muted); margin:0; font-size:13.5px; max-width:420px; margin:0 auto; }

  @media (max-width: 480px){
    header.hub-header{ padding:14px 16px; }
    .brand{ font-size:19px; }
    main{ padding:36px 16px 56px; }
    .hero h1{ font-size:21px; }
    .card{ padding:22px 18px 26px; }
  }
</style>
</head>
<body>

  <div class="topbar">Avante Travel</div>

  <header class="hub-header">
    <div class="brand">AVANTE<span>TRAVEL</span></div>
  </header>

  <main>
    <div id="content">
      <div class="hero">
        <h1>Loading your offer</h1>
        <p>One moment please&hellip;</p>
      </div>
    </div>
  </main>

  <script>
    var params = new URLSearchParams(window.location.search);
    var aff = (params.get('aff') || '').trim();
    var hook = (params.get('hook') || '').trim();
    var content = document.getElementById('content');

    function escapeHtml(s){
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function renderError(title, body){
      content.innerHTML =
        '<div class="placeholder">' +
          '<div class="badge">Unavailable</div>' +
          '<h3>' + escapeHtml(title) + '</h3>' +
          '<p>' + escapeHtml(body) + '</p>' +
        '</div>';
    }

    function isSafeUrl(u){
      return typeof u === 'string' && /^https?:\/\//i.test(u);
    }

    function renderOffer(data){
      var hasBooking = isSafeUrl(data.booking);
      var hasLanding = isSafeUrl(data.landing);

      if(!hasBooking && !hasLanding){
        renderError('This offer isn’t available right now', 'Please check back later or contact the person who shared this link with you.');
        return;
      }

      var html = '<div class="hero"><h1>Special Offer</h1><p>Brought to you by Avante Travel</p></div>';
      html += '<div class="card">';
      html += '<img class="promo-image" id="promoImage" alt="">';
      if(hasBooking){
        html += '<a class="cta" href="' + escapeHtml(data.booking) + '" target="_blank" rel="noopener">Book Now</a>';
      }
      if(hasLanding){
        html += '<a class="cta-outline" href="' + escapeHtml(data.landing) + '" target="_blank" rel="noopener">See full details</a>';
      }
      html += '</div>';
      content.innerHTML = html;

      var imgEl = document.getElementById('promoImage');
      imgEl.onload = function(){ imgEl.classList.add('show'); };
      imgEl.onerror = function(){ imgEl.classList.remove('show'); };
      // Admin-managed (or expired self-managed) hooks show the admin's
      // image, which is stored under the reserved "__admin__" key — not
      // this affiliate's own ID.
      var imgAff = (data.source === 'admin') ? '__admin__' : aff;
      imgEl.src = '/api/hook-image?aff=' + encodeURIComponent(imgAff) + '&hook=' + encodeURIComponent(hook);
    }

    if(!aff || !hook){
      renderError('This link is incomplete', 'Please check the link you were given, or contact the person who shared it with you.');
    } else {
      fetch('/api/hook?aff=' + encodeURIComponent(aff) + '&hook=' + encodeURIComponent(hook))
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(!data){
            renderError('This offer isn’t available yet', 'The person who shared this link may still be setting it up. Please check back soon.');
            return;
          }
          renderOffer(data);
        })
        .catch(function(){
          renderError('We couldn’t load this offer', 'Please try again in a moment.');
        });
    }
  </script>

</body>
</html>
