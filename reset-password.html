<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avante Travel Hub — Reset Password</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0DCDC2;
    --teal-dark:#0aa89f;
    --navy:#0e2f44;
    --ink:#333333;
    --muted:#808080;
    --mint:#f4fbfa;
    --line:#e3e9e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans', sans-serif;
    color:var(--ink);
    background:#ffffff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1,.brand,button{ font-family:'Montserrat', sans-serif; }

  .topbar{
    background:var(--teal);
    color:#fff;
    font-size:12.5px;
    padding:6px 24px;
    text-align:right;
  }
  header.hub-header{
    display:flex;
    align-items:center;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-weight:800;
    font-size:22px;
    color:var(--teal);
    letter-spacing:0.01em;
    line-height:1.1;
  }
  .brand span{ display:block; color:var(--navy); font-size:14px; font-weight:600; letter-spacing:0.08em;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:32px 30px 34px;
    box-shadow:0 10px 30px rgba(14,47,68,0.06);
  }
  .card h1{ color:var(--navy); font-size:20px; margin:0 0 6px; text-align:center; }
  .card .sub{ color:var(--muted); font-size:13px; text-align:center; margin:0 0 24px; }

  label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--teal-dark);
    margin:14px 0 6px;
  }
  label:first-of-type{ margin-top:0; }
  input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--navy);
    background:var(--mint);
  }
  input:focus{ outline:none; border-color:var(--teal); }

  .hint{ font-size:11.5px; color:var(--muted); margin-top:6px; }

  button.cta{
    margin-top:22px;
    width:100%;
    padding:13px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  button.cta:hover{ background:var(--teal-dark); }
  button.cta:disabled{ background:#bcd9d6; cursor:not-allowed; }

  .status{
    margin-top:14px;
    padding:10px 13px;
    border-radius:8px;
    font-size:12.5px;
    display:none;
    background:#fbeae8;
    color:#c0453a;
    border:1px solid #f0c8c2;
  }
  .status.show{ display:block; }
  .status.ok{ background:var(--mint); color:var(--teal-dark); border-color:#bfe6e2; }

  .forgot-link{
    display:block; text-align:center; margin-top:14px; font-size:12px;
    color:var(--teal-dark); text-decoration:none; font-weight:600;
  }
  .forgot-link:hover{ text-decoration:underline; }

  @media (max-width: 480px){
    header.hub-header{ padding:14px 16px; }
    .brand{ font-size:19px; }
    main{ padding:24px 16px; }
    .card{ padding:24px 20px 26px; }
  }
</style>
</head>
<body>

  <div class="topbar">Avante Travel &middot; Affiliate Hub</div>
  <header class="hub-header">
    <div class="brand">AVANTE<span>TRAVEL &middot; AFFILIATE HUB</span></div>
  </header>

  <main>
    <div class="card" id="card">
      <h1>Choose a New Password</h1>
      <p class="sub" id="sub">For affiliate <strong id="affShow"></strong>.</p>

      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 4 characters">

      <label for="pw2">New password again</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <div class="hint">After this, every device is logged out and you log in with the new password.</div>

      <button class="cta" id="saveBtn">Save New Password</button>
      <div class="status" id="statusMsg"></div>
      <a href="login.html" class="forgot-link" id="backLink">Back to log in</a>
    </div>
  </main>

  <script>
    var params = new URLSearchParams(window.location.search);
    var aff = (params.get('aff') || '').trim(), t = (params.get('t') || '').trim();
    var statusMsg = document.getElementById('statusMsg'), saveBtn = document.getElementById('saveBtn');
    document.getElementById('affShow').textContent = aff;
    document.getElementById('backLink').href = 'login.html' + (aff ? '?aff=' + encodeURIComponent(aff) : '');
    function showError(msg){ statusMsg.classList.remove('ok'); statusMsg.textContent = msg; statusMsg.classList.add('show'); }
    function showSuccess(msg){ statusMsg.textContent = msg; statusMsg.classList.add('show', 'ok'); }
    if(!aff || !t){ showError('This reset link is incomplete. Request a new one from the login page.'); saveBtn.disabled = true; }

    function save(){
      var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
      statusMsg.classList.remove('show');
      if(!a || a.length < 4){ showError('New password must be at least 4 characters.'); return; }
      if(a === '0000'){ showError('Choose a password other than 0000.'); return; }
      if(a !== b){ showError('The two passwords do not match.'); return; }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      fetch('/api/auth', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'resetConfirm', aff: aff, t: t, newPassword: a }) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d && d.ok){
            try{ localStorage.removeItem('avante-hub-auth:' + aff); localStorage.removeItem('avante-hub-session:' + aff); }catch(e){}
            showSuccess('Password changed. Taking you to log in…');
            setTimeout(function(){ window.location.href = 'login.html?aff=' + encodeURIComponent(aff); }, 1800);
          } else { saveBtn.disabled = false; saveBtn.textContent = 'Save New Password'; showError((d && d.error) || 'Could not change the password.'); }
        })
        .catch(function(){ saveBtn.disabled = false; saveBtn.textContent = 'Save New Password'; showError('Something went wrong. Please try again.'); });
    }
    saveBtn.addEventListener('click', save);
    document.getElementById('pw2').addEventListener('keydown', function(e){ if(e.key === 'Enter') save(); });
  </script>

</body>
</html>
