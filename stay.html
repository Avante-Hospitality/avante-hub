<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--STAY-META-->
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Property front store (/stay/<slug>), in-house guest page (/stay/<slug>/guest)
     and printable room card (/stay/<slug>/card). Served by
     netlify/edge-functions/stay-page.js; data from /api/stay (stay-api.js).
     Guide: how-to-property.html#frontstore — keep it up to date (CLAUDE.md). -->
<style>
:root{ --ink:#0e2f44; --teal:#0DCDC2; --teal-d:#08776f; --sand:#f7f3ec; --line:#e6e2da; --muted:#66706f; --warn:#8a3a00; --bg:#fbfaf7; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:#26302f; font:16px/1.6 'Noto Sans',Arial,sans-serif; -webkit-text-size-adjust:100%; }
a{ color:var(--teal-d); }
h1,h2,h3{ font-family:'Montserrat',sans-serif; color:var(--ink); line-height:1.2; margin:0; }
.wrap{ max-width:1160px; margin:0 auto; padding:0 16px; }
.top{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; }
.top .wrap{ display:flex; align-items:center; gap:12px; min-height:58px; }
.top .nm{ font:800 15px 'Montserrat',sans-serif; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top .nm small{ display:block; font:600 11px 'Noto Sans',sans-serif; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.ic{ display:inline-flex; align-items:center; justify-content:center; min-width:44px; height:44px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink); text-decoration:none; font-weight:700; font-size:14px; padding:0 14px; gap:6px; }
.ic.wa{ background:#25D366; border-color:#25D366; color:#fff; }
.hero{ position:relative; height:min(62vh,560px); min-height:320px; background:#d9d4ca center/cover no-repeat; display:flex; align-items:flex-end; }
.hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(14,47,68,0) 35%,rgba(14,47,68,.82)); }
.hero .wrap{ position:relative; z-index:1; color:#fff; padding-bottom:28px; width:100%; }
.hero h1{ color:#fff; font-size:clamp(28px,5vw,48px); }
.hero .pl{ font-weight:600; opacity:.92; margin-top:6px; }
.hero .wl{ margin-top:10px; font-size:18px; max-width:640px; }
.hero .allph{ position:absolute; right:16px; bottom:24px; z-index:2; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 22px; border-radius:10px; border:none; background:var(--ink); color:#fff; font:700 15px 'Montserrat',sans-serif; cursor:pointer; text-decoration:none; }
.btn.t{ background:var(--teal); color:var(--ink); }
.btn.g{ background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
.btn.sm{ min-height:38px; padding:0 14px; font-size:13px; }
.btn[disabled]{ opacity:.55; cursor:not-allowed; }
.btn:focus-visible,.ic:focus-visible,.chip:focus-visible,.day:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
.thumbs{ display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:thin; }
.thumbs button{ flex:0 0 auto; width:110px; height:76px; border-radius:10px; border:none; padding:0; background:#ddd center/cover; cursor:pointer; }
.grid{ display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:32px; align-items:start; padding:28px 0 60px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px; }
.sec{ margin-bottom:34px; }
.sec h2{ font-size:24px; margin-bottom:12px; }
.lead{ color:var(--muted); margin:-6px 0 14px; }
.text{ white-space:pre-line; }
.book{ position:sticky; top:76px; box-shadow:0 18px 50px rgba(14,47,68,.10); }
#calsec{ scroll-margin-top:90px; }
/* The calendar on the right, in the Book your stay frame's place (computer) */
.side{ position:sticky; top:76px; align-self:start; max-height:calc(100vh - 92px); overflow-y:auto; overscroll-behavior:contain; }
.side .calside{ box-shadow:0 18px 50px rgba(14,47,68,.10); padding:18px; }
.side .calside h2{ font-size:20px; margin-bottom:2px; }
.side .calside .lead{ margin:0 0 10px; font-size:14px; }
.side .calpick{ padding:12px 0 0; margin-top:10px; border-top:1px solid var(--line); }
.side .day{ min-height:44px; font-size:13px; }
.side .day small{ font-size:9.5px; }
.side .book{ position:static; margin-top:12px; }
.side .book.idle{ display:none; }
/* Choose your unit (from a Book link): one line per unit, ticked to book (Jean, 2026-10-23) */
.u1{ display:flex; align-items:center; gap:10px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; margin-top:8px; cursor:pointer; background:#fff; }
.u1 input{ width:20px; height:20px; margin:0; flex:0 0 auto; accent-color:#0aa89f; }
.u1 b{ flex:0 0 auto; }
.u1 .muted{ flex:1; min-width:0; font-size:14px; }
.u1 .p{ font-weight:800; white-space:nowrap; }
.u1.on{ border-color:#0DCDC2; background:#eafaf8; }
.u1h{ font-size:17px; margin:18px 0 6px; }
.book h2{ font-size:20px; margin-bottom:4px; }
.bkbusy{ display:none; margin-top:10px; font-weight:700; }
/* The guest's details form, over the page */
.book.asmodal{ position:fixed !important; inset:0; z-index:90; margin:0; border:0; border-radius:0; box-shadow:none; background:rgba(14,47,68,.6); overflow:auto; padding:16px; display:block !important; }
.book.asmodal .bkm{ position:relative; background:#fff; max-width:640px; margin:24px auto 40px; border-radius:16px; padding:22px 20px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
.book.asmodal .bkform{ display:none; }
.bkx{ position:absolute; top:10px; right:12px; width:40px; height:40px; border:2px solid var(--line); border-radius:50%; background:#fff; font-size:22px; line-height:1; cursor:pointer; }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.fld{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.fld label{ font:700 11.5px 'Montserrat',sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-d); }
.fld input,.fld select,.fld textarea{ width:100%; min-height:46px; border:1.5px solid #d8d3ca; border-radius:10px; padding:0 12px; font:15px 'Noto Sans',sans-serif; color:var(--ink); background:#fff; }
.fld textarea{ padding:10px 12px; min-height:70px; }
/* How will you pay? — two choices, each a round button with its words beside it (not the text box styling) */
.payby label{ display:flex; align-items:center; gap:10px; min-height:44px; font:500 15px 'Noto Sans',sans-serif; text-transform:none; letter-spacing:0; color:var(--ink); cursor:pointer; }
.payby input{ width:20px; height:20px; min-height:0; margin:0; padding:0; flex:0 0 auto; border:0; accent-color:#0aa89f; }
.payby legend{ font:700 15px 'Montserrat',sans-serif; color:var(--ink); margin-bottom:4px; }
.res{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.unit{ border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
.unit .u{ flex:1 1 150px; min-width:0; }
.unit b{ font:700 15px 'Montserrat',sans-serif; color:var(--ink); }
.unit .p{ font:800 17px 'Montserrat',sans-serif; color:var(--ink); }
.muted{ color:var(--muted); font-size:13.5px; }
.err{ background:#fff4e5; border:1px solid #f5c98a; color:var(--warn); border-radius:10px; padding:10px 12px; font-weight:600; font-size:14px; margin-top:12px; }
.ok{ background:#e3f8f6; color:#065e58; border-radius:12px; padding:14px; margin-top:12px; }
#calsec, #cal, #book, #nearby, #units{ scroll-margin-top:84px; }
.calpick{ margin-top:12px; padding:16px; }
.calpick .cp-t{ font:700 15px 'Montserrat',sans-serif; color:var(--ink); }
.calpick .cp-sum{ margin:12px 0 10px; font-size:14.5px; line-height:1.5; }
.cal-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.cal-h b{ font:800 18px 'Montserrat',sans-serif; color:var(--ink); }
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
.cal .dw{ font:700 11px 'Montserrat',sans-serif; color:var(--muted); text-align:center; text-transform:uppercase; padding-bottom:2px; }
.day{ min-height:52px; border-radius:10px; border:1.5px solid transparent; background:#f1eee8; color:#9aa0a0; font:700 14px 'Montserrat',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; }
.day.nc{ background:#fff; color:var(--ink); cursor:pointer; border-color:#e6e1d8; }
.day.op{ background:#e3f8f6; color:var(--ink); cursor:pointer; border-color:#bfece7; }
.day.op small{ font:600 10px 'Noto Sans',sans-serif; color:var(--teal-d); }
.day.sel{ background:var(--ink); color:#fff; border-color:var(--ink); }
.day.sel small{ color:#cfe9ee; }
.day.rng{ background:#cfeeea; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:10px; }
.legend i{ display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.chip{ min-height:38px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font:600 13px 'Montserrat',sans-serif; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }
.acts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.act{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
.act .im{ height:130px; background:#e9e4da center/cover; }
.act .bd{ padding:12px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
.act b{ font:700 15px 'Montserrat',sans-serif; color:var(--ink); }
.mpop img{ display:block; width:100%; height:130px; object-fit:cover; border-radius:8px; margin-bottom:8px; }
.mpop b{ display:block; font:800 15px/1.2 'Montserrat',sans-serif; color:var(--ink); }
.mpop .mk{ display:inline-block; margin-top:4px; background:#ffde59; color:var(--ink); border-radius:999px; padding:2px 8px; font:700 11.5px 'Montserrat',sans-serif; }
.mpop p{ margin:6px 0 0; font-size:13px; line-height:1.4; color:#4a5658; }
.mpop .pz{ font-weight:700; color:var(--ink); }
.mpop a{ display:inline-block; margin-top:6px; font-weight:700; }
#map{ height:320px; border-radius:14px; border:1px solid var(--line); margin-top:14px; z-index:0; }
.offers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.offer{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
.offer .im{ aspect-ratio:1/1; background:#e9e4da center/cover; }
.offer .bd{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.contact{ display:flex; flex-wrap:wrap; gap:10px; }
.foot{ text-align:center; color:var(--muted); font-size:13px; padding:28px 0 100px; }
.bar{ display:none; }
.lb{ position:fixed; inset:0; background:rgba(8,20,28,.94); z-index:200; display:flex; align-items:center; justify-content:center; }
.lb img{ max-width:94vw; max-height:84vh; border-radius:8px; }
.lb button{ position:absolute; background:rgba(255,255,255,.14); color:#fff; border:none; width:52px; height:52px; border-radius:50%; font-size:24px; cursor:pointer; }
.lb .x{ top:16px; right:16px; } .lb .pv{ left:12px; } .lb .nx{ right:12px; }
.lb .n{ position:absolute; bottom:18px; color:#fff; font-size:14px; }
/* ---- front store look (Jean, 2026-10-13): photo-first, price and rating up front ---- */
.hero2{ position:relative; min-height:min(78vh,680px); background:#0e2f44 center/cover no-repeat; display:flex; align-items:flex-end; color:#fff; }
.hero2::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,28,41,.55) 0%,rgba(7,28,41,0) 30%,rgba(7,28,41,.1) 50%,rgba(7,28,41,.9) 100%); }
.hero2 .wrap{ position:relative; z-index:1; width:100%; padding-top:120px; padding-bottom:40px; }
.hero2 .kick{ display:inline-block; font:700 12.5px 'Montserrat',sans-serif; letter-spacing:.18em; text-transform:uppercase; color:#fff; background:rgba(7,28,41,.55); border-radius:999px; padding:7px 14px; }
.hero2 h1{ color:#fff; font:800 clamp(34px,6.2vw,68px)/1.02 'Montserrat',sans-serif; margin:10px 0 0; max-width:900px; text-shadow:0 3px 18px rgba(0,0,0,.35); letter-spacing:-.01em; }
.hero2 .sub{ font-size:clamp(16px,2vw,20px); margin-top:12px; max-width:680px; text-shadow:0 2px 10px rgba(0,0,0,.5); }
.hero2 .badges{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.badge{ display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:10px 18px; font:800 16px 'Montserrat',sans-serif; text-decoration:none; }
.badge.price{ background:#ffde59; color:var(--ink); box-shadow:0 10px 26px rgba(0,0,0,.25); }
.badge.rate{ background:rgba(255,255,255,.95); color:var(--ink); }
.badge.rate .st{ color:#e6a700; }
.hero2 .ctas{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.hero2 .btn.t{ min-height:54px; padding:0 28px; font-size:16px; border-radius:999px; }
.hero2 .btn.w{ min-height:54px; padding:0 24px; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.6); }
.mosaic{ display:grid; grid-template-columns:2fr 1fr 1fr; grid-template-rows:170px 170px; gap:8px; margin-top:18px; position:relative; }
.mosaic button{ border:none; padding:0; border-radius:14px; background:#ddd center/cover; cursor:pointer; }
.mosaic button:first-child{ grid-row:span 2; }
.mosaic .all{ position:absolute; right:12px; bottom:12px; }
.slides{ display:none; position:relative; margin-top:18px; }
.slides .pic{ display:block; width:100%; height:260px; border:none; padding:0; border-radius:14px; background:#ddd center/cover; cursor:pointer; }
.slides .arr{ position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:var(--ink); font:700 30px/1 'Montserrat',sans-serif; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; }
.slides .pv{ left:10px; } .slides .nx{ right:10px; }
.slides .cnt{ position:absolute; right:12px; bottom:12px; background:rgba(14,47,68,.8); color:#fff; border-radius:999px; padding:4px 10px; font:700 12.5px 'Montserrat',sans-serif; }
.hl{ display:flex; flex-wrap:wrap; gap:10px; margin:22px 0 0; padding:0; list-style:none; }
.hl li{ display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:9px 16px; font:700 14px 'Montserrat',sans-serif; color:var(--ink); }
.hl li span{ font-size:18px; }
.units{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
.ucard{ background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 8px 24px rgba(14,47,68,.06); }
.ucard .im{ aspect-ratio:4/3; background:#e9e4da center/cover; position:relative; }
.ucard .im .pr{ position:absolute; left:12px; bottom:12px; background:#ffde59; color:var(--ink); border-radius:999px; padding:6px 12px; font:800 14px 'Montserrat',sans-serif; }
.ucard .bd{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.ucard b{ font:800 17px 'Montserrat',sans-serif; color:var(--ink); }
.ucard .meta{ font-size:14px; color:var(--teal-d); font-weight:700; }
.ucard .ub{ margin-top:auto; display:flex; flex-wrap:wrap; gap:8px; padding-top:6px; }
.ucard .imbtn{ display:block; width:100%; padding:0; border:0; background:none; cursor:pointer; }
.ucard .im .cnt{ position:absolute; right:12px; bottom:12px; background:rgba(14,47,68,.82); color:#fff; border-radius:999px; padding:4px 10px; font:700 13px 'Noto Sans',sans-serif; }
.ucard .det{ font-size:14px; color:var(--muted); }
.am{ list-style:none; margin:4px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px 14px; font-size:14.5px; }
.ucard .am{ grid-template-columns:1fr 1fr; font-size:13.5px; gap:4px 10px; }
.am li{ display:flex; gap:8px; align-items:flex-start; line-height:1.35; }
.am li span{ width:20px; flex:none; text-align:center; }
.amx summary{ cursor:pointer; color:var(--teal-d); font-weight:700; font-size:14px; margin-top:6px; }
.rgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.rg{ padding:16px 18px; }
.rg h3{ font-size:16px; margin-bottom:8px; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.tile{ display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; color:var(--ink); text-decoration:none; box-shadow:0 8px 24px rgba(14,47,68,.07); }
.tile .im{ position:relative; aspect-ratio:16/10; background:#dfe7ea center/cover; }
.tile .im.noimg{ background:linear-gradient(135deg,#0e2f44,#14506a); }
.tile .km{ position:absolute; top:12px; left:12px; background:#ffde59; color:var(--ink); border-radius:999px; padding:5px 11px; font:800 13px 'Montserrat',sans-serif; }
.tile .bd{ padding:12px 16px 16px; }
.tile b{ display:block; font:800 17px/1.2 'Montserrat',sans-serif; color:var(--ink); }
.tile span{ display:block; font-size:14px; color:#4a5658; margin-top:5px; line-height:1.45; }
.tile .pz{ font-weight:700; color:var(--ink); }
.pv-note{ position:relative; z-index:70; background:#ffde59; color:var(--ink); text-align:center; font:700 13px 'Montserrat',sans-serif; padding:6px 10px; }
@media (max-width:900px){ .mosaic{ display:none; } .slides{ display:block; } .hero2{ min-height:72vh; } }
.hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.center{ text-align:center; padding:80px 16px; }
/* guest page */
.gwrap{ max-width:720px; margin:0 auto; padding:0 16px 80px; }
.ghead{ background:var(--ink); color:#fff; padding:34px 16px 30px; text-align:center; }
.ghead h1{ color:#fff; font-size:30px; }
.ghead p{ margin:6px 0 0; opacity:.85; }
.gbtns{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:-22px 0 22px; }
.gbtns a{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 8px; text-align:center; text-decoration:none; color:var(--ink); font:700 14px 'Montserrat',sans-serif; box-shadow:0 10px 26px rgba(14,47,68,.10); }
.gbtns a span{ display:block; font-size:26px; margin-bottom:4px; }
.wifi{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.wifi code{ font:700 18px 'Montserrat',sans-serif; color:var(--ink); background:var(--sand); padding:6px 12px; border-radius:8px; }
/* room card */
.cardpage{ max-width:560px; margin:24px auto; padding:0 16px 40px; }
.rc{ background:#fff; border:2px solid var(--ink); border-radius:18px; padding:28px 26px; text-align:center; }
.rc h1{ font-size:28px; }
.rc .sub{ color:var(--muted); margin:4px 0 18px; }
.rc .qr{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:10px 0 16px; }
.rc .qr figure{ margin:0; }
.rc .qr svg{ width:190px; height:190px; display:block; }
.rc .qr.small svg{ width:120px; height:120px; }
.rc figcaption{ font:700 13px 'Montserrat',sans-serif; color:var(--ink); margin-top:6px; }
.rc .lines{ text-align:left; display:inline-block; margin:6px auto 0; font-size:16px; line-height:1.9; }
.rc .lines b{ display:inline-block; min-width:96px; color:var(--teal-d); font:700 13px 'Montserrat',sans-serif; text-transform:uppercase; letter-spacing:.05em; }
.rc .by{ margin-top:18px; font-size:12px; color:var(--muted); }
.cardtools{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
@media print{
  @page{ size:A5 portrait; margin:10mm; }
  body{ background:#fff; }
  .cardtools,.noprint{ display:none !important; }
  .cardpage{ margin:0; max-width:none; padding:0; }
  .rc{ border-width:1.5px; }
}
@media (max-width:900px){
  .grid{ grid-template-columns:1fr; gap:22px; }
  .book{ position:static; order:-1; }
  .book.oncal .bkform{ display:none; }
  .book.oncal.idle{ display:none; }
  .book.oncal .bkbusy{ display:block; }

    if (d.contact.phone || d.contact.email) h += '<section class="card sec"><h2 style="font-size:20px;margin-bottom:8px">Contact</h2>' + (d.contact.phone ? '<div>📞 <a href="' + esc(telLink(d)) + '">' + esc(d.contact.phone) + '</a></div>' : '') + (d.contact.email ? '<div>✉️ <a href="mailto:' + esc(d.contact.email) + '">' + esc(d.contact.email) + '</a></div>' : '') +
      '<div style="margin-top:6px">🧭 <a href="' + esc(mapsLink(d)) + '" target="_blank" rel="noopener">Directions</a></div></section>';
    if (d.showActivities) h += nearbyHtml();
    h += '<section class="card sec" style="text-align:center"><h2 style="font-size:20px">Loved your stay?</h2><p class="muted">Come back soon. Book direct for our best rate.</p><a class="btn t" href="' + esc(storeUrl()) + '">Book your next stay</a></section>';
    h += '<p class="foot" style="padding-bottom:30px">' + esc(d.name) + ' · Avante Travel</p></div>';
    app.innerHTML = h; drawMap();
  }

  // ---------- printable room card ----------
  function renderCard() {
    if (typeof qrcode === 'undefined') {
      loadScript('/qrcode.js').then(renderCard, function (e) { console.error('stay.html: QR codes not shown —', e.message); renderCardHtml(); });
      return;
    }
    renderCardHtml();
  }
  function renderCardHtml() {
    var d = S.d, g = d.guest || {};
    var h = '<div class="cardpage"><div class="cardtools"><button type="button" class="btn" data-act="print">🖨️ Print this card</button><a class="btn g" href="' + esc(guestUrl()) + '" target="_blank" rel="noopener">Open the guest page</a></div>' +
      '<div class="rc"><h1>Welcome to ' + esc(d.name) + '</h1><p class="sub">We\'re glad you\'re here. Everything you need is one scan away.</p>' +
      '<div class="qr"><figure>' + qrSvg(guestUrl()) + '<figcaption>Scan for guest information</figcaption></figure></div>' +
      '<div class="lines">' + (d.contact.phone ? '<div><b>Call</b> ' + esc(d.contact.phone) + '</div>' : '') + (d.contact.whatsapp ? '<div><b>WhatsApp</b> +' + esc(d.contact.whatsapp) + '</div>' : '') + (d.contact.email ? '<div><b>Email</b> ' + esc(d.contact.email) + '</div>' : '') +
      (g.wifiName ? '<div><b>Wi-Fi</b> ' + esc(g.wifiName) + '</div>' : '') + (g.wifiPassword ? '<div><b>Password</b> ' + esc(g.wifiPassword) + '</div>' : '') + '</div>' +
      '<div class="qr small" style="margin-top:20px"><figure>' + qrSvg(storeUrl()) + '<figcaption>Book your next stay direct</figcaption></figure></div>' +
      '<div class="by">' + esc(storeUrl().replace(/^https?:\/\//, '')) + '</div></div>' +
      '<p class="muted noprint" style="text-align:center;margin-top:14px">Prints on A5. Change the details in the hub: Property Affiliate → Front store.</p></div>';
    app.innerHTML = h;
  }

  // ---------- actions ----------
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function syncForm() { if (document.getElementById('ci')) { S.ci = val('ci'); S.co = val('co'); S.adults = +val('ad') || 2; S.children = +val('ch') || 0; } }
  app.addEventListener('change', function (e) {
    if (e.target.id === 'ci') { syncForm(); if (S.co <= S.ci) { S.co = add(S.ci, Math.max(1, S.d.minStay || 1)); var co = document.getElementById('co'); if (co) co.value = S.co; } S.quote = null; S.pick = null; drawCal(); }
    if (e.target.id === 'co') { syncForm(); S.quote = null; S.pick = null; drawCal(); }
    if (e.target.id === 'cpi') { var o = document.getElementById('cpo'); if (o && (!o.value || o.value <= e.target.value)) o.value = add(e.target.value, Math.max(1, S.d.minStay || 1)); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.pick && !S.busy) { S.pick = null; drawBook(); return; }
    if (S.lb < 0) return;
    if (e.key === 'Escape') { closeLb(); } else if (e.key === 'ArrowRight') { showLb(S.lb + 1); } else if (e.key === 'ArrowLeft') { showLb(S.lb - 1); }
  });
  var lbEl = null, lbBack = null;
  function showLb(i) {
    var ph = lbPhotos(); if (!ph.length) return; S.lb = (i + ph.length) % ph.length;
    if (!lbEl) { lbBack = document.activeElement; lbEl = document.createElement('div'); lbEl.className = 'lb'; lbEl.setAttribute('role', 'dialog'); lbEl.setAttribute('aria-modal', 'true'); lbEl.setAttribute('aria-label', 'Photos'); document.body.appendChild(lbEl);
      lbEl.addEventListener('click', function (e) { var a = e.target.closest('[data-lb]'); if (a) { var k = a.getAttribute('data-lb'); if (k === 'x') closeLb(); else showLb(S.lb + (k === 'n' ? 1 : -1)); } else if (e.target === lbEl) closeLb(); }); }
    lbEl.innerHTML = '<img src="' + esc(ph[S.lb]) + '" alt="' + esc(S.lbList ? S.lbName : S.d.name) + ' photo ' + (S.lb + 1) + '"><button type="button" class="x" data-lb="x" aria-label="Close">✕</button>' + (ph.length > 1 ? '<button type="button" class="pv" data-lb="p" aria-label="Previous photo">‹</button><button type="button" class="nx" data-lb="n" aria-label="Next photo">›</button>' : '') + '<div class="n">' + (S.lb + 1) + ' / ' + ph.length + '</div>';
    lbEl.querySelector('.x').focus();
  }
  function lbPhotos() { return S.lbList || S.d.photos || []; }
  function unitByName(n) { return (S.d.units || []).filter(function (u) { return u.name === n; })[0] || { photos: [] }; }
  function closeLb() { if (lbEl) { lbEl.remove(); lbEl = null; } S.lb = -1; if (lbBack) lbBack.focus(); }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'lb') { S.lbName = t.getAttribute('data-unit') || ''; S.lbList = S.lbName ? (unitByName(S.lbName).photos || []).map(safeUrl).filter(Boolean) : null; return showLb(+t.getAttribute('data-i')); }
    if (a === 'sl') { var n = (S.d.photos || []).length; S.sl = ((S.sl || 0) + +t.getAttribute('data-d') + n) % n; var sw = document.getElementById('photos-ph'); if (sw) { var pic = sw.querySelector('.pic'); pic.style.backgroundImage = 'url(\'' + S.d.photos[S.sl].replace(/'/g, '%27') + '\')'; pic.style.backgroundPosition = (bgPos(S.d.photos[S.sl]).split(':')[1] || ''); pic.setAttribute('data-i', S.sl); pic.setAttribute('aria-label', 'Open photo ' + (S.sl + 1) + ' of ' + n); sw.querySelector('.cnt').textContent = (S.sl + 1) + ' / ' + n; } return; }
    if (a === 'toBook') { var b = document.getElementById(S.d.showCalendar ? 'calsec' : 'book') || document.getElementById('book'); if (b) { b.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
    if (a === 'calGo') {
      var ci2 = val('cpi'), co2 = val('cpo');
      if (!ci2 || !co2 || co2 <= ci2) { S.err = 'Choose a departure after the arrival.'; drawBook(); var cp = document.getElementById('cpo'); if (cp) cp.focus(); return; }
      S.ci = ci2; S.co = co2; S.picking = false; S.quote = null; S.pick = null; S.err = ''; S.calFrom = ci2;
      drawCal(); drawBook(); var cs = document.getElementById('cal'); if (cs) cs.scrollIntoView({ behavior: 'smooth', block: 'start' }); return;
    }
    if (a === 'calMove') { S.calFrom = calStart(add(calStart(S.calFrom), CAL_DAYS * (+t.getAttribute('data-n')))); drawCal(); return; }
    if (a === 'calLoad') { loadCal(); return drawCal(); }
    if (a === 'calUnit') { S.calUnit = t.getAttribute('data-u'); return drawCal(); }
    if (a === 'day') {
      var dsel = t.getAttribute('data-d'); syncForm();
      if (!S.picking || dsel <= S.ci) { S.ci = dsel; S.co = add(dsel, Math.max(1, S.d.minStay || 1)); S.picking = true; }
      else { S.co = add(dsel, 1); S.picking = false; }
      S.quote = null; S.pick = null; drawCal(); drawBook(); return;
    }
    if (CFG.preview && (a === 'quote' || a === 'calCheck' || a === 'book' || a === 'km')) { S.err = a === 'km' ? '' : 'This is a preview: booking works on the real page.'; return a === 'km' ? null : drawBook(); }
    if (a === 'calCheck') {
      var ci3 = val('cpi'), co3 = val('cpo'); if (ci3 && co3 && co3 > ci3) { S.ci = ci3; S.co = co3; }
      if (document.querySelector('.side #calsec')) { S.linkModal = true; S.autoPick = true; } // the free units open over the page
      S.err = ''; S.pick = null; S.picking = false; if (S.ci) S.calFrom = S.ci; drawBook(); drawCal();
      var bk = document.getElementById('book'); if (bk) bk.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var qb = bk && bk.querySelector('[data-act="quote"]'); if (qb) qb.click(); return;
    }
    if (a === 'quote') {
      syncForm(); S.err = ''; S.pick = null; S.sel = []; S.showAll = false;
      if (!hasDates()) { S.err = 'Choose your arrival and departure dates.'; return drawBook(); }
      if (S.co <= S.ci) { S.err = 'Choose a check-out after the check-in.'; return drawBook(); }
      S.busy = 'quote'; drawBook();
      return post({ action: 'quote', checkIn: S.ci, checkOut: S.co }).then(function (r) {
        S.busy = false; if (!r.ok) { S.err = r.error; S.quote = null; } else S.quote = r;
        // The check has just read these days, so the calendar shows them without asking again.
        if (r.ok && S.d.showCalendar) { S.calFrom = S.ci; loadCal(); }
        var fromLink = S.autoPick;
        // From a link whose stay is shorter than the minimum: lengthen it to the minimum and check again.
        if (fromLink && S.quote && S.quote.tooShort && S.quote.minStay) {
          S.co = add(S.ci, S.quote.minStay); S.note = 'The minimum stay is ' + S.quote.minStay + ' nights, so check-out is ' + nice(S.co) + '. Change the dates if you like.';
          S.quote = null; drawCal(); drawBook(); var qb2 = document.querySelector('#book [data-act="quote"]'); if (qb2) qb2.click(); return;
        }
        // From a hook or flyer link: with one unit free (or the unit the link names) go straight to the details form.
        if (fromLink && S.quote) {
          // unit=A or unit=A,B (a hook about one unit type): only those units are offered.
          var res = S.quote.results || [], names = S.linkUnit ? S.linkUnit.toLowerCase().split(',').map(function (x) { return x.trim(); }).filter(Boolean) : [];
          var mine = names.length ? res.filter(function (x) { return names.indexOf(x.unit.toLowerCase()) > -1; }) : [];
          S.onlyUnits = mine.length ? mine.map(function (x) { return x.unit; }) : null;
          var list = mine.length ? mine : res;
          if (list.length === 1) { S.sel = [list[0].unit]; if (!S.linkModal) S.pick = pickOf(S.sel); } // the frame: ticked
        }
        S.autoPick = false; drawBook();
        // From a link, always land on the result: the details form, the units to pick from, or why nothing is free.
        if (fromLink) { var bk2 = S.linkModal ? null : document.getElementById('book'); if (bk2) bk2.scrollIntoView({ behavior: 'smooth', block: 'start' }); var gf = S.pick && document.getElementById('gf'); if (gf) setTimeout(function () { gf.focus({ preventScroll: true }); }, 400); }
      }).catch(function () { S.busy = false; S.err = 'Couldn\'t check right now. Try again.'; drawBook(); });
    }
    if (a === 'toggle') {
      var u = t.getAttribute('data-u'); S.sel = (S.sel || []).slice(); S.err = '';
      if (chosen(u)) S.sel = S.sel.filter(function (x) { return x !== u; });
      else if (S.sel.length >= MAX_UNITS) S.err = 'You can book up to ' + MAX_UNITS + ' units at once. For more, please contact us.';
      else S.sel.push(u);
      return redrawKeeping();
    }
    if (a === 'showall') { S.showAll = true; return drawBook(); }
    if (a === 'pickSel') { if (!(S.sel || []).length) return; S.pick = pickOf(S.sel); drawBook(); var f = document.getElementById('gf'); if (f) f.focus(); return; }
    if (a === 'unpick') { S.pick = null; return drawBook(); }
    if (a === 'closelink') { S.linkModal = false; if (location.hash === '#book') history.replaceState(null, '', location.pathname + location.search); return drawBook(); }
    if (a === 'changedates') { S.linkModal = false; drawBook(); var cs = document.getElementById('calsec') || document.getElementById('book'); if (cs) cs.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (a === 'book') {
      var g = { first: val('gf').trim(), last: val('gl').trim(), email: val('ge').trim(), cellphone: val('gc').trim() };
      S.err = '';
      var chosenUnits = S.pick ? S.pick.units : (S.sel || []).slice();
      if (!chosenUnits.length) { S.err = 'Please select a unit first.'; redrawKeeping(); var ul = document.getElementById('u1list'); if (ul) ul.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      if (!g.first || !g.last) S.err = 'Enter your first and last name.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g.email)) S.err = 'Enter a valid email address.';
      else if (g.cellphone.replace(/\D/g, '').length < 9) S.err = 'Enter your cellphone number.';
      if (S.err) { redrawKeeping(); var er0 = document.querySelector('#book .err'); if (er0) er0.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      if (document.getElementById('pad')) { S.adults = +val('pad') || S.adults; S.children = +val('pch') || 0; }
      S.busy = 'book'; t.disabled = true; t.textContent = 'Booking…';
      return post({ action: 'book', checkIn: S.quote.checkIn, checkOut: S.quote.checkOut, units: chosenUnits, guest: g, adults: S.adults, children: S.children, notes: val('gn'), website: val('website'), payBy: (document.querySelector('input[name="payby"]:checked') || {}).value }).then(function (r) {
        S.busy = false;
        if (!r.ok) { S.err = r.error || 'The booking didn\'t go through.'; t.disabled = false; t.textContent = 'Confirm booking'; var er = document.querySelector('#book .err'); if (er) er.remove(); t.insertAdjacentHTML('afterend', '<div class="err" role="alert">' + esc(S.err) + '</div>'); return; }
        S.booked = r; S.quote = null; S.pick = null; S.sel = []; S.calData = {}; drawBook(); drawCal(); document.getElementById('book').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }).catch(function () { S.busy = false; t.disabled = false; t.textContent = 'Confirm booking'; });
    }
    if (a === 'again') { S.booked = null; return drawBook(); }
    if (a === 'km') { S.km = +t.getAttribute('data-k'); return api('slug=' + encodeURIComponent(CFG.slug) + (CFG.mode === 'guest' ? '&guest=1' + (CFG.key ? '&key=' + encodeURIComponent(CFG.key) : '') : '') + '&km=' + S.km).then(function (d) { if (d.ok) { S.d.nearby = d.nearby; S.d.mapActs = d.mapActs; S.km = d.nearbyKm; var el = document.getElementById('nearby'); if (el) { el.outerHTML = nearbyHtml(); drawMap(); } } }); }
    if (a === 'copyWifi') { var pw = (S.d.guest || {}).wifiPassword || ''; (navigator.clipboard ? navigator.clipboard.writeText(pw) : Promise.reject()).then(function () { t.textContent = 'Copied ✓'; }, function () { prompt('Wi-Fi password:', pw); }); return; }
    if (a === 'print') { window.print(); return; }
  });
  // Preview for the front store builder in the hub (Jean, 2026-10-13): the
  // page data comes from the builder (postMessage), nothing is loaded or booked.
  CFG.preview = new URLSearchParams(location.search).get('preview') === '1';
  if (CFG.preview) {
    CFG.mode = 'store';
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'fs-preview' || !e.data.data) return;
      var d = e.data.data, y = window.scrollY; CFG.slug = d.slug || CFG.slug;
      S.d = d; S.km = d.nearbyKm; S.offers = (d.offers || []).filter(function (o) { return o.booking || o.landing; });
      if (!S.calFrom) S.calFrom = d.firstBookable;
      render(); window.scrollTo(0, y);
      if (e.data.scrollTo) { var el = document.getElementById(e.data.scrollTo); if (el && !el.offsetParent) el = document.getElementById(e.data.scrollTo + '-ph') || el; if (el) el.scrollIntoView({ block: 'start' }); }
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'fs-preview-ready' }, location.origin);
    return;
  }
  if (!CFG.slug) { app.innerHTML = '<div class="center"><h1>This link is incomplete</h1></div>'; return; }
  load();
})();
